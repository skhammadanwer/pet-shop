<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pete's Pet Shop</title>

    <!-- Bootstrap -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-xs-12 col-sm-8 col-sm-push-2">
          <h1 class="text-center">Pete's Pet Shop</h1>
          <hr/>
          <br/>
        </div>
      </div>

      <!-- Connect Wallet button row -->
      <div class="row">
        <div class="col-xs-12 col-sm-8 col-sm-push-2 text-center">
          <button
            id="connectButton"
            type="button"
            aria-label="Connect Wallet"
            class="button_YtCf cta wallet-button_CvpX text-decoration-none primary_nDUu">
            Connect Wallet
          </button>
          <br/><br/>
        </div>
      </div>

      <div class="row">
        <div class="col-xs-12 text-center">
          <p><strong>Filter by breed</strong></p>
          <button type="button" class="btn btn-primary btn-breed-filter" data-breed="all" style="margin: 0 4px 8px;">All (16)</button>
          <button type="button" class="btn btn-default btn-breed-filter" data-breed="Scottish Terrier" style="margin: 0 4px 8px;">Scottish Terrier (3)</button>
          <button type="button" class="btn btn-default btn-breed-filter" data-breed="French Bulldog" style="margin: 0 4px 8px;">French Bulldog (5)</button>
          <button type="button" class="btn btn-default btn-breed-filter" data-breed="Boxer" style="margin: 0 4px 8px;">Boxer (3)</button>
          <button type="button" class="btn btn-default btn-breed-filter" data-breed="Golden Retriever" style="margin: 0 4px 8px;">Golden Retriever (5)</button>
          <p id="filterCount" class="text-muted" style="margin-top: 10px;">Showing 16 pets</p>
          <br/>
        </div>
      </div>

      <div id="petsRow" class="row">
        <!-- PETS LOAD HERE -->
      </div>
    </div>

    <div id="petTemplate" style="display: none;">
      <div class="col-sm-6 col-md-4 col-lg-3">
        <div class="panel panel-default panel-pet">
          <div class="panel-heading">
            <h3 class="panel-title">Scrappy</h3>
          </div>
          <div class="panel-body">
            <img src="" alt="Pet image">
            <br/><br/>
            <strong>Breed</strong>: <span class="pet-breed">Golden Retriever</span><br/>
            <strong>Age</strong>: <span class="pet-age">3</span><br/>
            <strong>Location</strong>: <span class="pet-location">Warren, MI</span><br/>
            <strong>Owner</strong>: <span class="pet-owner">Available</span><br/>
            <strong>History</strong>:
            <ul class="pet-history list-unstyled" style="margin-top: 6px; font-size: 12px;">
              <li class="text-muted">None yet</li>
            </ul>
            <div class="form-group transfer-form" style="margin-top: 8px; margin-bottom: 8px;">
              <input type="text" class="form-control input-sm pet-transfer-address" placeholder="New owner address">
              <button class="btn btn-default btn-sm btn-transfer" type="button" data-id="0" style="margin-top: 6px;">Transfer</button>
              <p class="text-danger pet-transfer-error" style="margin-top: 6px; display: none;"></p>
            </div>
            <button class="btn btn-default btn-adopt" type="button" data-id="0">Adopt</button>
            <hr>
            <h4>Vaccination Record</h4>
            <button
              class="btn btn-info btn-view-vaccinations"
              type="button"
              data-id="0">
              View Records
            </button>
            <!-- Add style="display: none;" below data-id="0" when finish all the code  -->
            <button
              class="btn btn-success btn-add-vaccination"
              type="button"
              data-id="0"
              >
              + Add Vaccination
            </button>
            <br><br>
            <div class="vaccination-form" style="display: none;">
              <input
                type="text"
                class="form-control vaccine-name"
                placeholder="Vaccine Name">
              <br>
              <input
                type="date"
                class="form-control vaccine-date">
              <br>
              <input
                type="text"
                class="form-control clinic-name"
                placeholder="Clinic Name">
              <br>
              <button
                class="btn btn-primary btn-save-vaccination"
                type="button"
                data-id="0">
                Save Vaccination
              </button>
              <br><br>
            </div>
            <div
              class="vaccination-message"
              style="display: none;">
            </div>
            <div class="vaccination-history"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <!-- Include all compiled plugins (below), or include individual files as needed -->
    <script src="js/bootstrap.min.js"></script>
    <script src="js/web3.min.js"></script>
    <script src="js/truffle-contract.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
