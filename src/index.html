<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pete's Pet Shop</title>

    <!-- Bootstrap -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-xs-12 col-sm-8 col-sm-push-2">
          <h1 class="text-center">Pete's Pet Shop</h1>
          <hr/>
          <br/>
        </div>
      </div>

      <!-- Connect Wallet button row -->
      <div class="row">
        <div class="col-xs-12 col-sm-8 col-sm-push-2 text-center">
          <button
            id="connectButton"
            type="button"
            aria-label="Connect Wallet"
            class="button_YtCf cta wallet-button_CvpX text-decoration-none primary_nDUu">
            Connect Wallet
          </button>
          <br/><br/>
        </div>
      </div>

      <div class="row">
        <div class="col-xs-12 col-sm-8 col-sm-push-2">
          <div class="panel panel-default">
            <div class="panel-heading">
              <h3 class="panel-title">Add a pet to the shop</h3>
            </div>
            <div class="panel-body">
              <div class="row">
                <div class="col-sm-6">
                  <label for="petName">Name</label>
                  <input type="text" class="form-control" id="petName" placeholder="Aquila">
                </div>
                <div class="col-sm-6">
                  <label for="petBreed">Breed</label>
                  <input type="text" class="form-control" id="petBreed" placeholder="Bald Eagle">
                </div>
              </div>
              <br/>
              <div class="row">
                <div class="col-sm-4">
                  <label for="petAge">Age</label>
                  <input type="number" min="0" class="form-control" id="petAge" placeholder="5">
                </div>
                <div class="col-sm-8">
                  <label for="petLocation">Location</label>
                  <input type="text" class="form-control" id="petLocation" placeholder="Toronto, Ontario">
                </div>
              </div>
              <br/>
              <div class="row">
                <div class="col-sm-12">
                  <label for="petPicture">Image path</label>
                  <input type="text" class="form-control" id="petPicture" placeholder="images/eagle.JPG">
                </div>
              </div>
              <br/>
              <button id="addPetButton" class="btn btn-primary" type="button">Add Pet</button>
              <p id="addPetMessage" class="text-muted" style="margin-top: 8px; display: none;"></p>
            </div>
          </div>
          <br/>
        </div>
      </div>

      <div class="row">
        <div class="col-xs-12 text-center">
          <p><strong>Filter by breed</strong></p>
          <div id="breedFilters">
            <button type="button" class="btn btn-primary btn-breed-filter" data-breed="all" style="margin: 0 4px 8px;">All</button>
          </div>
          <p id="filterCount" class="text-muted" style="margin-top: 10px;">Showing 0 pets</p>
          <br/>
          <p><strong>Filter by status</strong></p>
          <button type="button" class="btn btn-primary btn-status-filter" data-status="all" style="margin: 0 4px 8px;">All</button>
          <button type="button" class="btn btn-default btn-status-filter" data-status="available" style="margin: 0 4px 8px;">Available</button>
          <button type="button" class="btn btn-default btn-status-filter" data-status="adopted" style="margin: 0 4px 8px;">Adopted</button>
          <br/>
          <button type="button" id="myPetsToggle" class="btn btn-default" style="margin-top: 8px;">My pets only</button>
          <p id="myPetsHint" class="text-muted" style="margin-top: 8px; display: none;">Connect your wallet to use My pets.</p>
          <br/>
        </div>
      </div>

      <div id="petsRow" class="row">
        <!-- PETS LOAD HERE -->
      </div>
    </div>

    <div id="petTemplate" style="display: none;">
      <div class="col-sm-6 col-md-4 col-lg-3">
        <div class="panel panel-default panel-pet">
          <div class="panel-heading">
            <h3 class="panel-title">Scrappy</h3>
          </div>
          <div class="panel-body">
            <img src="" alt="Pet image">
            <br/><br/>
            <strong>Breed</strong>: <span class="pet-breed">Golden Retriever</span><br/>
            <strong>Age</strong>: <span class="pet-age">3</span><br/>
            <strong>Location</strong>: <span class="pet-location">Warren, MI</span><br/>
            <strong>Owner</strong>: <span class="pet-owner">Available</span><br/>
            <strong>History</strong>:
            <ul class="pet-history list-unstyled" style="margin-top: 6px; font-size: 12px;">
              <li class="text-muted">None yet</li>
            </ul>
            <div class="form-group transfer-form" style="margin-top: 8px; margin-bottom: 8px;">
              <input type="text" class="form-control input-sm pet-transfer-address" placeholder="New owner address">
              <button class="btn btn-default btn-sm btn-transfer" type="button" data-id="0" style="margin-top: 6px;">Transfer</button>
              <p class="text-danger pet-transfer-error" style="margin-top: 6px; display: none;"></p>
            </div>
            <button class="btn btn-default btn-adopt" type="button" data-id="0">Adopt</button>
            <button class="btn btn-warning btn-sm btn-return" type="button" data-id="0" disabled>Return Pet (0.01 ETH)</button>
            <hr>
            <h4>Vaccination Record</h4>
            <button
              class="btn btn-info btn-view-vaccinations"
              type="button"
              data-id="0">
              View Records
            </button>
            <button
              class="btn btn-success btn-add-vaccination"
              type="button"
              data-id="0">
              + Add Vaccination
            </button>
            <br><br>
            <div class="vaccination-form" style="display: none;">
              <input
                type="text"
                class="form-control vaccine-name"
                placeholder="Vaccine Name">
              <br>
              <input
                type="date"
                class="form-control vaccine-date">
              <br>
              <input
                type="text"
                class="form-control clinic-name"
                placeholder="Clinic Name">
              <br>
              <button
                class="btn btn-primary btn-save-vaccination"
                type="button"
                data-id="0">
                Save Vaccination
              </button>
              <br><br>
            </div>
            <div
              class="vaccination-message"
              style="display: none;">
            </div>
            <div class="vaccination-history"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <!-- Include all compiled plugins (below), or include individual files as needed -->
    <script src="js/bootstrap.min.js"></script>
    <script src="js/web3.min.js"></script>
    <script src="js/truffle-contract.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
